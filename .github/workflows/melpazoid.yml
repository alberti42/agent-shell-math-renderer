---

# The checks MELPA's reviewers run, on every push: melpazoid
# <https://github.com/riscy/melpazoid> byte-compiles the package as
# package-build would, runs package-lint and checkdoc over it, and looks
# for the habits MELPA asks packages to avoid.
#
# The CI job byte-compiles and runs checkdoc against the Emacs of the
# runner.  This job runs them against MELPA's own recipe and a current
# checkout of package-lint, which is where a symbol newer than the
# declared Emacs floor shows up.
#
# It fails the build only on errors.

name: melpazoid

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A commit pushed to develop and then to main starts this workflow twice.
  # This job waits for the earlier run of the same commit and, when that
  # run succeeded, the other job is skipped; see
  # .github/scripts/skip-if-passed.sh.  On a pull request, or a run started
  # by hand, it always runs.
  skip:
    name: Earlier run of this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 30
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/skip-if-passed.sh melpazoid.yml

  melpazoid:
    needs: skip
    if: needs.skip.outputs.skip != 'true'
    runs-on: ubuntu-latest
    name: MELPA checks
    # A passing run takes about 3 minutes.  Without a limit, a stalled
    # apt-get keeps the job running for GitHub's default of 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # melpazoid.py runs `emacs --batch' on the runner as well as in its
      # container.  `emacs-nox' without recommends is far fewer packages
      # than `emacs', and the man-db trigger, which runs after every
      # install on the runner image, is turned off: both are where the
      # install has stalled.
      - name: Install melpazoid
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends emacs-nox
          emacs --version
          git clone https://github.com/riscy/melpazoid.git ~/melpazoid
          pip install ~/melpazoid

      # melpazoid installs latex-to-svg-backend from MELPA, which has
      # develop's backend floor only once the backend is released.  Until
      # then the file signals when it is loaded, and melpazoid fails on
      # that alone.  On develop, and on a pull request from it, lower the
      # floor in this checkout to 0.16.1, the oldest backend with
      # `latex-to-svg-backend-version', so that melpazoid checks the rest
      # against the backend MELPA has.
      - name: Lower the backend floor to the backend on MELPA
        if: github.ref_name == 'develop' || github.head_ref == 'develop'
        run: |
          sed -i 's/^(defconst agent-shell-math-renderer--backend-version "[0-9.]*"$/(defconst agent-shell-math-renderer--backend-version "0.16.1"/' \
            agent-shell-math-renderer.el
          grep -n '^(defconst agent-shell-math-renderer--backend-version "0.16.1"$' \
            agent-shell-math-renderer.el

      # melpazoid fetches from the GitHub API without a token, and on
      # 2026-11-08 GitHub timed out such requests ("Increase in timeouts
      # for some unauthenticated users").  Python imports
      # .github/scripts/sitecustomize.py when it starts, from PYTHONPATH,
      # and that module sends GITHUB_TOKEN with the requests to
      # api.github.com.
      - name: Run melpazoid
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/.github/scripts
          LOCAL_REPO: ${{ github.workspace }}
          # The recipe MELPA itself builds from, so that what is checked
          # here is what MELPA ships.
          RECIPE: (agent-shell-math-renderer :fetcher github :repo "alberti42/agent-shell-math-renderer")
          # The package is on MELPA already; without this, melpazoid
          # reports its presence there as a problem.
          EXIST_OK: 'true'
        run: make -C ~/melpazoid
